summary: spring-boot extension test
environment:
  SCENARIO/bare: bare
  SCENARIO/base_2404: ubuntu-24.04
  ROCKCRAFT_ENABLE_EXPERIMENTAL_EXTENSIONS: "true"

execute: |
  NAME="spring-boot-${SCENARIO//./-}"
  ROCK_FILE="${NAME}_0.1_amd64.rock"
  IMAGE="${NAME}:0.1"
  JAVA_VERSION=21

  sudo apt-get update -y && sudo apt-get install -y wget unzip

  PROJECT_BASE=maven
  wget -O spring.zip \
    "https://start.spring.io/starter.zip?type=${PROJECT_BASE}-project&language=java&bootVersion=3.4.2&\
    baseDir=spring-boot&groupId=com.example&artifactId=spring-boot&name=spring-boot&\
    description=Demo%20project%20for%20Spring%20Boot&packageName=com.example.spring-boot&\
    packaging=jar&javaVersion=${JAVA_VERSION}&dependencies=web"
  unzip spring.zip && rm -f spring.zip

  run_rockcraft init --name "${NAME}" --profile spring-boot-framework
  sed -i "s/^base: .*/base: ${SCENARIO//-/@}/g" rockcraft.yaml
  if [ "${SCENARIO}" != "bare" ]; then
    sed -i "s/^build-base: .*/build-base: ${SCENARIO//-/@}/g" rockcraft.yaml
  fi

  function run_test() {
    # rockcraft clean is required here because the cached layer writes to npmrc
    # multiple times, causing the app to crash on first run.
    rockcraft clean
    run_rockcraft pack

    test -f "${ROCK_FILE}"
    test ! -d work

    # Ensure docker does not have this container image
    docker rmi --force "${IMAGE}"
    # Install container
    sudo rockcraft.skopeo --insecure-policy copy "oci-archive:${ROCK_FILE}" \
    "docker-daemon:${IMAGE}"
    # Ensure container exists
    docker images "${IMAGE}" | MATCH "${NAME}"

    # Ensure container doesn't exist
    docker rm -f "${NAME}-container"

    # test the default spring-boot service
    docker run --name "${NAME}-container" -d -p 8080:8080 "${IMAGE}"
    retry -n 5 --wait 2 curl localhost:8080
    http_status=$(curl -s -o /dev/null -w "%{http_code}" localhost:8080)
    [ "${http_status}" -eq 404 ]
  }

  run_test
  shopt -s extglob && rm -rf !(rockcraft.yaml | task.yaml)

  # test the spring-boot service with a gradle project
  PROJECT_BASE=gradle
  wget -O spring.zip \
    "https://start.spring.io/starter.zip?type=$PROJECT_BASE-project&language=java&bootVersion=3.4.2&\
    baseDir=spring-boot&groupId=com.example&artifactId=spring-boot&name=spring-boot&\
    description=Demo%20project%20for%20Spring%20Boot&packageName=com.example.spring-boot&\
    packaging=jar&javaVersion=${JAVA_VERSION}&dependencies=web"
  unzip spring.zip && rm -f spring.zip

  run_test
  rm -rf !(rockcraft.yaml | task.yaml)

  # test the spring-boot service with different Java version
  JAVA_VERSION=17
  PROJECT_BASE=maven
  wget -O spring.zip \
    "https://start.spring.io/starter.zip?type=$PROJECT_BASE-project&language=java&bootVersion=3.4.2&\
    baseDir=spring-boot&groupId=com.example&artifactId=spring-boot&name=spring-boot&\
    description=Demo%20project%20for%20Spring%20Boot&packageName=com.example.spring-boot&\
    packaging=jar&javaVersion=${JAVA_VERSION}&dependencies=web"
  cat <<EOF >> rockcraft.yaml
  parts:
    spring-boot-framework/install-app:
      build-packages:
        - openjdk-${JAVA_VERSION}-jdk
    spring-boot-framework/runtime:
      build-packages:
        - openjdk-${JAVA_VERSION}-jdk
  EOF
  run_test
  # check java version in docker container
  docker exec "${NAME}-container" java --version | grep "openjdk ${JAVA_VERSION}"

restore: |
  NAME="spring-boot-${SCENARIO//./-}"
  docker stop "${NAME}-container"
  docker rm "${NAME}-container"
  rm -f "*.rock" rockcraft.yaml
  docker system prune -a -f
